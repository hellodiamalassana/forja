<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forja App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <h1>Forja App</h1>
      </div>
    </header>

    <main>
      <div class="welcome-card">
        <h2>Bienvenue sur votre application</h2>
        <p>Cette application a été générée par Forja, votre assistant IA pour créer des applications desktop.</p>

        <div class="features">
          <div class="feature">
            <div class="feature-icon">🚀</div>
            <h3>Rapide</h3>
            <p>Performance native avec Electron</p>
          </div>

          <div class="feature">
            <div class="feature-icon">🎨</div>
            <h3>Moderne</h3>
            <p>Interface utilisateur élégante</p>
          </div>

          <div class="feature">
            <div class="feature-icon">🔒</div>
            <h3>Sécurisé</h3>
            <p>Context isolation activé</p>
          </div>
        </div>

        <button class="primary-button" onclick="handleAction()">
          Commencer
        </button>
      </div>
    </main>

    <footer>
      <p>Créé avec <span class="heart">❤️</span> par Forja</p>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
